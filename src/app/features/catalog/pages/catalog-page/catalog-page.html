<section class="catalog-page">
  <div class="page-header">
    <h1>Catalog</h1>
    <p>Browse the timeline catalog.</p>
  </div>

  <nav class="catalog-tabs" aria-label="Catalog sections">
    @for (tab of tabs; track tab.key) {
      <button
        type="button"
        class="catalog-tab"
        [class.catalog-tab--active]="activeTab() === tab.key"
        [attr.aria-pressed]="activeTab() === tab.key"
        (click)="selectTab(tab.key)">
        {{ tab.label }}
      </button>
    }
  </nav>

  @switch (activeTab()) {
    @case ('characters') {
      <app-character-catalog [isAdmin]="isAdmin()" />
    }
    @case ('vehicles') {
      <app-name-catalog [isAdmin]="isAdmin()" catalog="vehicles" title="Vehicles" noun="vehicle" />
    }
    @case ('locations') {
      <app-name-catalog [isAdmin]="isAdmin()" catalog="locations" title="Locations" noun="location" />
    }
    @case ('species') {
      <app-species-catalog [isAdmin]="isAdmin()" />
    }
    @case ('sources') {
      <app-source-material-catalog [isAdmin]="isAdmin()" />
    }
    @case ('events') {
      <app-timeline-event-catalog [isAdmin]="isAdmin()" />
    }
  }
</section>
