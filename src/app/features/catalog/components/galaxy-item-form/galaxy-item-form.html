<form class="galaxy-form" (ngSubmit)="save.emit()">
  <label class="galaxy-field">
    <span>Name</span>
    <input name="galaxyName" [(ngModel)]="name" placeholder="Name…" required autofocus />
  </label>

  @if (showsSectorType()) {
    <label class="galaxy-field">
      <span>Sector type</span>
      <input
        name="galaxySectorType"
        [(ngModel)]="sectorType"
        placeholder="e.g. sector, region, oversector…"
      />
    </label>
  }

  @if (showsCoordinates()) {
    <label class="galaxy-field">
      <span>Coordinates</span>
      <input
        name="galaxyCoordinates"
        [(ngModel)]="coordinates"
        placeholder="e.g. R-16 (grid reference)"
      />
    </label>
  }

  @if (showsTypePicker()) {
    <label class="galaxy-field">
      <span>Type</span>
      <select name="galaxyType" [(ngModel)]="type" aria-label="Location type">
        @for (type of planetLocationTypes(); track type) {
          <option [ngValue]="type">{{ type }}</option>
        }
      </select>
    </label>
  }

  @if (showsDescription()) {
    <label class="galaxy-field">
      <span>Description</span>
      <input name="galaxyDescription" [(ngModel)]="description" placeholder="Details…" />
    </label>
  }

  @if (linkField(); as field) {
    <div class="galaxy-field">
      <span>{{ field.label }}</span>
      <div class="galaxy-link-list">
        @for (option of field.options; track option.id) {
          <label class="galaxy-link-option">
            <input
              type="checkbox"
              [checked]="linkIds().includes(option.id)"
              (change)="toggleLink(option.id)"
            />
            <span>{{ option.name }}</span>
          </label>
        }
      </div>
    </div>
  }

  <p class="galaxy-form-hint">{{ hint() }}</p>
  <div class="galaxy-form-actions">
    <button class="btn btn-primary btn-sm" type="submit" [disabled]="busy()">
      {{ submitLabel() }}
    </button>
    <button class="btn btn-sm" type="button" (click)="cancel.emit()">Cancel</button>
  </div>
</form>
