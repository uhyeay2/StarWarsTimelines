<div
  class="admin-popup-backdrop"
  (click)="cancel.emit()"
  (keydown.escape)="cancel.emit()"
  tabindex="-1"
></div>
<div class="admin-popup" role="dialog" aria-modal="true" [attr.aria-label]="heading()">
  <h3>{{ heading() }}</h3>
  <form (ngSubmit)="save.emit()">
    <label class="source-field">
      <span>Number</span>
      <input name="unitNumber" type="number" min="1" required [(ngModel)]="number" autofocus />
    </label>
    <label class="source-field">
      <span>Title</span>
      <input name="unitTitle" [(ngModel)]="title" placeholder="Title (optional)" />
    </label>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="admin-popup-actions">
      <button class="btn btn-primary btn-sm" type="submit" [disabled]="saving()">
        {{ saving() ? 'Adding…' : 'Add' }}
      </button>
      <button class="btn btn-sm" type="button" (click)="cancel.emit()">Cancel</button>
    </div>
  </form>
</div>
