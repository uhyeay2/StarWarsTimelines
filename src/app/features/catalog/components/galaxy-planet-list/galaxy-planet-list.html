@for (node of nodes(); track node.planet.id) {
  <li class="galaxy-node">
    <div class="galaxy-row">
      <button
        class="galaxy-toggle"
        type="button"
        [attr.aria-expanded]="host().isExpanded('planet-' + node.planet.id)"
        (click)="host().togglePlanet(node.planet)"
      >
        {{ host().isExpanded('planet-' + node.planet.id) ? '▾' : '▸' }}
      </button>
      <div class="galaxy-row-main">
        <div class="galaxy-row-line">
          <span class="galaxy-name">{{ node.planet.name }}</span>
          @if (node.planet.description) {
            <span class="galaxy-meta">{{ node.planet.description }}</span>
          }
        </div>
      </div>
      @if (host().isAdmin()) {
        <div class="galaxy-actions">
          <button class="btn btn-sm" type="button" (click)="host().startEditPlanet(node.planet)">
            Edit
          </button>
          <button
            class="btn btn-sm btn-danger"
            type="button"
            (click)="host().requestDelete('planet', node.planet.id, node.planet.name)"
          >
            Delete
          </button>
        </div>
      }
    </div>

    @if (host().isExpanded('planet-' + node.planet.id)) {
      <ul class="galaxy-children">
        <app-galaxy-location-list
          [host]="host()"
          [nodes]="node.locations"
          [addParentId]="node.planet.id"
        />
      </ul>
    }
  </li>
}
@if (host().isAdmin()) {
  <li class="galaxy-add-row">
    <button class="btn btn-sm" type="button" (click)="host().openAddPlanet(addParentId())">
      + Add planet
    </button>
  </li>
}
