<div
  class="admin-popup-backdrop"
  (click)="cancel.emit()"
  (keydown.escape)="cancel.emit()"
  tabindex="-1"
></div>
<div class="admin-popup" role="dialog" aria-modal="true" aria-label="Add character">
  <h3>Add character</h3>
  <form (ngSubmit)="save.emit()">
    <label class="source-field">
      <span>Name</span>
      <input name="newName" [(ngModel)]="name" placeholder="Character name…" required autofocus />
    </label>
    <div class="source-field">
      <span>Species</span>
      <app-searchable-select
        ariaLabel="Species"
        [options]="speciesOptions()"
        noneLabel="Unknown"
        [(value)]="speciesId"
      />
    </div>
    <div class="source-field">
      <span>Birth planet</span>
      <app-searchable-select
        ariaLabel="Birth planet"
        [options]="locationOptions()"
        noneLabel="Unknown"
        [(value)]="planetBornOnId"
      />
    </div>
    <div class="year-pair">
      <label class="source-field">
        <span>Born from</span>
        <input
          name="newBirthFrom"
          type="number"
          step="1"
          placeholder="-41 = 41 BBY"
          [(ngModel)]="birthFrom"
        />
      </label>
      <label class="source-field">
        <span>Born to</span>
        <input
          name="newBirthTo"
          type="number"
          step="1"
          placeholder="-39 = 39 BBY"
          [(ngModel)]="birthTo"
        />
      </label>
    </div>
    <div class="year-pair">
      <label class="source-field">
        <span>Died from</span>
        <input
          name="newDeathFrom"
          type="number"
          step="1"
          placeholder="4 = 4 ABY"
          [(ngModel)]="deathFrom"
        />
      </label>
      <label class="source-field">
        <span>Died to</span>
        <input
          name="newDeathTo"
          type="number"
          step="1"
          placeholder="35 = 35 ABY"
          [(ngModel)]="deathTo"
        />
      </label>
    </div>
    <p class="admin-popup-hint">
      Years use the galactic timeline: negative for BBY, positive for ABY. Leave a pair blank when
      unknown.
    </p>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="admin-popup-actions">
      <button class="btn btn-primary btn-sm" type="submit" [disabled]="saving()">
        {{ saving() ? 'Adding…' : 'Add' }}
      </button>
      <button class="btn btn-sm" type="button" (click)="cancel.emit()">Cancel</button>
    </div>
  </form>
</div>
