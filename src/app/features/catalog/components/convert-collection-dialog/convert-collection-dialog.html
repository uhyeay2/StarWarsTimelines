<div
  class="admin-popup-backdrop"
  (click)="cancel.emit()"
  (keydown.escape)="cancel.emit()"
  tabindex="-1"
></div>
<div
  class="admin-popup"
  role="dialog"
  aria-modal="true"
  aria-label="Convert to Collection"
  cdkTrapFocus
>
  <h3>Convert to Collection</h3>
  <p class="admin-popup-hint">
    "{{ title() }}" becomes the collection's title. The current book stays as book 1 under its
    existing name with all of its chapters, and everyone's reading progress carries over.
  </p>
  <form (ngSubmit)="convert.emit()">
    <label class="source-field">
      <span>Collection title</span>
      <input
        name="collectionTitle"
        [(ngModel)]="title"
        placeholder="Collection title…"
        required
        autofocus
      />
    </label>
    @if (error()) {
      <p class="form-error" role="alert">{{ error() }}</p>
    }
    <div class="admin-popup-actions">
      <button class="btn btn-primary btn-sm" type="submit" [disabled]="saving()">
        {{ saving() ? 'Converting…' : 'Convert' }}
      </button>
      <button class="btn btn-sm" type="button" (click)="cancel.emit()">Cancel</button>
    </div>
  </form>
</div>
