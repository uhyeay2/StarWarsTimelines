@for (node of nodes(); track node.id) {
  <li class="galaxy-node galaxy-node--leaf">
    <div class="galaxy-row">
      <div class="galaxy-row-main">
        <div class="galaxy-row-line">
          <span class="galaxy-name">{{ node.name }}</span>
        </div>
      </div>
      @if (host().isAdmin()) {
        <div class="galaxy-actions">
          <button
            class="btn btn-sm"
            type="button"
            (click)="host().startEditLocation(node, addParentId())"
          >
            Edit
          </button>
          <button
            class="btn btn-sm btn-danger"
            type="button"
            (click)="host().requestDelete('planet-location', node.id, node.name)"
          >
            Delete
          </button>
        </div>
      }
    </div>
  </li>
}
@if (host().isAdmin()) {
  <li class="galaxy-add-row">
    <button class="btn btn-sm" type="button" (click)="host().openAddLocation(addParentId())">
      + Add location
    </button>
  </li>
}
