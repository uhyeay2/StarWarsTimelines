<header class="site-header">
  <a class="brand" routerLink="/">Star Wars Timelines</a>
  <div class="site-header-right">
    <nav class="site-nav">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
      <a routerLink="/timeline" routerLinkActive="active">Timeline</a>
      <a routerLink="/library" routerLinkActive="active">Library</a>
      @if (user()?.role === 'Admin') {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
    </nav>
    <div class="site-user">
      @if (user(); as currentUser) {
        <a class="user-name" routerLink="/settings" title="Account settings">{{
          currentUser.displayName
        }}</a>
        <button type="button" class="logout-button" (click)="logout()">Log out</button>
      } @else {
        <a class="login-link" routerLink="/login">Log in</a>
      }
    </div>
  </div>
</header>

<router-outlet />
