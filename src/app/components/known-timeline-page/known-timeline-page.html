<!-- ─── Known Timeline Page ─────────────────────────────────────────────── -->
<section class="known-timeline-page">

  <!-- ─── Login Prompt (when logged out) ─────────────────────────────── -->
  @if (!user()) {
    <app-login-prompt>Log in to build your known timeline from your tracked events.</app-login-prompt>
  <!-- ─── Known Timeline Layout (when logged in) ─────────────────────── -->
  } @else {
    <div class="known-timeline-layout">

      <!-- ─── Status Toggle Filters ──────────────────────────────────── -->
      <div class="status-toggles" role="group" aria-label="Which tracked statuses to include">
        <span class="status-toggles-label">Include</span>
        <button
          type="button"
          role="switch"
          class="status-toggle"
          [class.status-toggle--active]="includeCompleted()"
          [attr.aria-pressed]="includeCompleted()"
          (click)="toggleStatus('completed')">Completed</button>
        <button
          type="button"
          role="switch"
          class="status-toggle"
          [class.status-toggle--active]="includeInProgress()"
          [attr.aria-pressed]="includeInProgress()"
          (click)="toggleStatus('inProgress')">In Progress</button>
        <button
          type="button"
          role="switch"
          class="status-toggle"
          [class.status-toggle--active]="includeWishListed()"
          [attr.aria-pressed]="includeWishListed()"
          (click)="toggleStatus('wishListed')">Wish Listed</button>
      </div>
      <!-- ─── End Status Toggle Filters ──────────────────────────────── -->

      <!-- ─── Timeline Component ─────────────────────────────────────── -->
      <app-timeline
        [sourceIds]="consumedIds()"
        [heading]="'Known Timeline'"
        [description]="'Events from the source material you are watching, reading, or have finished. Add or adjust progress from My Tracked Events.'" />
      <!-- ─── End Timeline Component ─────────────────────────────────── -->
    </div>
  }
</section>
<!-- ─── End Known Timeline Page ───────────────────────────────────────────── -->
