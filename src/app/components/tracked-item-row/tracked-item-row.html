<div
  class="tracked-item-row"
  [class.tracked-item-row--dragging]="dragging()"
  [attr.draggable]="showReorder() ? 'true' : null"
  (dragstart)="emitDragStart()"
  (dragover)="emitDragOver($event)"
  (dragend)="emitDragEnd()"
  (drop)="emitDrop()">
  @if (showReorder()) {
    <span class="drag-handle" aria-hidden="true">⠿</span>
  }
  <div class="item-info">
    <span class="item-title">{{ item().title }}</span>
    <span class="medium-chip">{{ item().medium }}</span>
  </div>
  <div class="item-controls">
    @if (showReorder()) {
      <button
        type="button"
        class="move-button"
        [disabled]="first()"
        [attr.aria-label]="'Move ' + item().title + ' up'"
        (click)="emitMoveUp()">▲</button>
      <button
        type="button"
        class="move-button"
        [disabled]="last()"
        [attr.aria-label]="'Move ' + item().title + ' down'"
        (click)="emitMoveDown()">▼</button>
    }
    @if ((item().units?.length ?? 0) > 0) {
      @if (!hasGroupUnits()) {
        <span class="status-badge">{{ item().status }}</span>
      }
      <ul class="unit-list" [attr.aria-label]="'Progress for ' + item().title">
        @for (group of groupUnits(); track $index) {
          <li class="unit-group">
            <div class="unit-group-header">
              <span class="unit-group-label">{{ group.groupTitle }}</span>
              <select
                class="group-status-select"
                [attr.aria-label]="'Status for ' + group.groupTitle"
                (change)="onGroupStatusChange(group.containerId, $event)">
                <option value="" disabled [selected]="getGroupStatus(group) === null" hidden>Track…</option>
                @for (status of statuses; track status) {
                  <option [value]="status" [selected]="getGroupStatus(group) === status">{{ status }}</option>
                }
                <option value="remove">Remove From Library</option>
              </select>
            </div>
          </li>
        }
      </ul>
     } @else {
      <select
        class="status-select"
        [attr.aria-label]="'Status for ' + item().title"
        (change)="onStatusChange($event)">
        @for (status of statuses; track status) {
          <option [value]="status" [selected]="item().status === status">{{ status }}</option>
        }
        <option value="remove">Remove From Library</option>
      </select>
    }
  </div>
</div>
