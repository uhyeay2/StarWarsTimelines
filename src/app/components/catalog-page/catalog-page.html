<section class="admin-page">
  <div class="page-header">
    <h1>Admin</h1>
    <p>Manage the timeline catalog.</p>
  </div>

  <nav class="admin-tabs" aria-label="Catalog sections">
    @for (tab of tabs; track tab.key) {
      <button
        type="button"
        class="admin-tab"
        [class.admin-tab--active]="activeTab() === tab.key"
        [attr.aria-pressed]="activeTab() === tab.key"
        (click)="selectTab(tab.key)">
        {{ tab.label }}
      </button>
    }
  </nav>

  @switch (activeTab()) {
    @case ('characters') {
      <app-name-catalog-admin catalog="characters" title="Characters" noun="character" />
    }
    @case ('vehicles') {
      <app-name-catalog-admin catalog="vehicles" title="Vehicles" noun="vehicle" />
    }
    @case ('locations') {
      <app-name-catalog-admin catalog="locations" title="Locations" noun="location" />
    }
    @case ('sources') {
      <app-source-material-admin />
    }
  }
</section>
