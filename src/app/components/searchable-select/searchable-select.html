<div class="searchable-select">
  <button
    type="button"
    class="ss-toggle"
    aria-haspopup="listbox"
    [attr.aria-expanded]="open()"
    [attr.aria-label]="ariaLabel()"
    (click)="toggle()">
    <span class="ss-value">{{ selectedName() }}</span>
    <span class="ss-caret" aria-hidden="true">▾</span>
  </button>

  @if (open()) {
    <div class="ss-panel">
      <input
        #searchInput
        name="searchableSelectQuery"
        type="text"
        class="ss-search"
        placeholder="Type to search…"
        [(ngModel)]="query"
        (keydown)="onSearchKeydown($event)" />
      <ul class="ss-options" role="listbox">
        @for (option of entries(); track option.id) {
          <li
            role="option"
            class="ss-option"
            [class.ss-option--selected]="option.id === value()"
            [class.ss-option--active]="$index === activeIndex()"
            (click)="pick(option)"
            (pointerenter)="activeIndex.set($index)">
            {{ option.name }}
          </li>
        }
        @empty {
          <li class="ss-empty">No matches</li>
        }
      </ul>
    </div>
  }
</div>
